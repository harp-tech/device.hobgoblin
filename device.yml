%YAML 1.1
---
# yaml-language-server: $schema=https://harp-tech.org/draft-02/schema/device.json
device: Hobgoblin
whoAmI: 123
firmwareVersion: "0.2"
hardwareTargets: "1.0"
registers:
  DigitalInputState:
    address: 32
    type: U8
    access: Event
    maskType: DigitalInputs
    description: Reflects the state of the digital input lines.
  DigitalOutputSet: &doutput
    address: 33
    type: U8
    access: [Write, Event]
    maskType: DigitalOutputs
    description: Sets the specified output lines and reports each pulse start. Setting a line stops its pulse train.
  DigitalOutputClear:
    <<: *doutput
    address: 34
    access: Write
    description: Clears the specified output lines. Clearing a line stops its pulse train.
  DigitalOutputToggle:
    <<: *doutput
    address: 35
    access: Write
    description: Toggles the specified output lines. Toggling a line stops its pulse train.
  DigitalOutputState:
    <<: *doutput
    address: 36
    access: Write
    description: Writes the state of all output lines. Writing the state stops every pulse train.
  AnalogData:
    address: 37
    type: U16
    length: 3
    access: Event
    description: Reports the sampled analog signal on each of the ADC input channels. The ADC is capped at 12 bits of resolution.
    payloadSpec:
      AnalogInput0:
        offset: 0
        description: The analog value sampled from ADC channel 0.
      AnalogInput1:
        offset: 1
        description: The analog value sampled from ADC channel 1.
      AnalogInput2:
        offset: 2
        description: The analog value sampled from ADC channel 2.
  PulseTrainGP15: &pulseTrain
    address: 38
    type: U32
    length: 3
    access: [Write, Event]
    description: Starts a pulse train on digital output GP15, or stops it if the pulse width is zero.
    payloadSpec:
      PulseWidth:
        offset: 0
        defaultValue: 500000
        description: Specifies the duration in microseconds that each pulse is high. A value of zero stops the pulse train.
      PulsePeriod:
        offset: 1
        defaultValue: 1000000
        minValue: 1
        description: Specifies the interval in microseconds between the start of each pulse.
      PulseCount:
        offset: 2
        defaultValue: 1
        description: Specifies the number of pulses in the pulse train. A value of zero runs the pulse train until it is stopped.
  PulseTrainGP16:
    <<: *pulseTrain
    address: 39
    description: Starts a pulse train on digital output GP16, or stops it if the pulse width is zero.
  PulseTrainGP17:
    <<: *pulseTrain
    address: 40
    description: Starts a pulse train on digital output GP17, or stops it if the pulse width is zero.
  PulseTrainGP18:
    <<: *pulseTrain
    address: 41
    description: Starts a pulse train on digital output GP18, or stops it if the pulse width is zero.
  PulseTrainGP19:
    <<: *pulseTrain
    address: 42
    description: Starts a pulse train on digital output GP19, or stops it if the pulse width is zero.
  PulseTrainGP20:
    <<: *pulseTrain
    address: 43
    description: Starts a pulse train on digital output GP20, or stops it if the pulse width is zero.
  PulseTrainGP21:
    <<: *pulseTrain
    address: 44
    description: Starts a pulse train on digital output GP21, or stops it if the pulse width is zero.
  PulseTrainGP22:
    <<: *pulseTrain
    address: 45
    description: Starts a pulse train on digital output GP22, or stops it if the pulse width is zero.
  PulseEventEnable:
    address: 46
    type: U8
    access: Write
    maskType: DigitalOutputs
    defaultValue: 255
    description: Specifies the digital output lines whose pulse trains report the start of each pulse on DigitalOutputSet.
bitMasks:
  DigitalInputs:
    description: Specifies the state of port digital input lines.
    bits:
      GP2:
        value: 0x1
        description: Digital input on pin GP2
      GP3:
        value: 0x2
        description: Digital input on pin GP3
      GP12:
        value: 0x4
        description: Digital input on pin GP12
      GP13:
        value: 0x8
        description: Digital input on pin GP13
      GP14:
        value: 0x10
        description: Digital input on pin GP14
  DigitalOutputs:
    description: Specifies the state of port digital output lines.
    bits:
      GP15:
        value: 0x1
        description: Digital output on pin GP15
      GP16:
        value: 0x2
        description: Digital output on pin GP16
      GP17:
        value: 0x4
        description: Digital output on pin GP17
      GP18:
        value: 0x8
        description: Digital output on pin GP18
      GP19:
        value: 0x10
        description: Digital output on pin GP19
      GP20:
        value: 0x20
        description: Digital output on pin GP20
      GP21:
        value: 0x40
        description: Digital output on pin GP21
      GP22:
        value: 0x80
        description: Digital output on pin GP22
